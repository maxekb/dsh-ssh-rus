<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="t">
  <title id="t">dsh-ssh-rus — удалённый SSH</title>
  <defs>
    <linearGradient id="slab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16304F"/>
      <stop offset="1" stop-color="#0A1730"/>
    </linearGradient>
    <linearGradient id="prompt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7DE3F4"/>
      <stop offset="1" stop-color="#3DDC97"/>
    </linearGradient>
    <linearGradient id="lock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC861"/>
      <stop offset="1" stop-color="#F0A32E"/>
    </linearGradient>
  </defs>

  <!-- terminal slab -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#slab)"/>
  <rect x="4.75" y="4.75" width="118.5" height="118.5" rx="27.25" fill="none" stroke="#2C4E7A" stroke-width="1.5"/>

  <!-- window chrome -->
  <g fill="#3E5F8A">
    <circle cx="25" cy="24" r="3.4"/>
    <circle cx="36" cy="24" r="3.4"/>
    <circle cx="47" cy="24" r="3.4"/>
  </g>
  <path d="M18 36 H110" stroke="#24446B" stroke-width="2" stroke-linecap="round"/>

  <!-- shell prompt: chevron + underscore -->
  <path d="M27 54 L47 71 L27 88" fill="none" stroke="url(#prompt)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M57 88 H76" fill="none" stroke="url(#prompt)" stroke-width="9" stroke-linecap="round"/>

  <!-- padlock: the "secure" in secure shell -->
  <path d="M94 82 V75 a9 9 0 0 1 18 0 v7" fill="none" stroke="url(#lock)" stroke-width="6" stroke-linecap="round"/>
  <rect x="84" y="80" width="38" height="28" rx="8" fill="url(#lock)"/>
  <circle cx="103" cy="94" r="3.6" fill="#0A1730"/>
</svg>
